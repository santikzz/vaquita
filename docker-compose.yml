services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    container_name: vaquita-app
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage
    env_file:
      - path: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
        - vaquita-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: vaquita-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/pgsql-optimizations.cfg:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - vaquita-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
      image: redis:7-alpine
      container_name: vaquita-redis
      restart: unless-stopped 
      command: redis-server
      volumes:
        - redis_data:/data
      networks:
        - vaquita-network
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 30s
        timeout: 3s
        retries: 3
        start_period: 5s

volumes:
  storage_data:
  postgres_data:
  redis_data:

networks:
  vaquita-network:
    driver: bridge