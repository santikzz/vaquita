# --------------------------------------------------
# postgresql tuning - adjust per available RAM
# --------------------------------------------------
#
# scaling reference table:
#
# RAM    shared_buffers  effective_cache_size  work_mem  maintenance_work_mem  max_workers
# 16 GB  4 GB            12 GB                 32 MB     512 MB                8
# 32 GB  8 GB            24 GB                 64 MB     1 GB                  16
# 64 GB  16 GB           48 GB                 128 MB    2 GB                  32
# 128 GB 32 GB           96 GB                 128 MB    4 GB                  64
# 256 GB 64 GB           192 GB                256 MB    8 GB                  96
#
# notes:
#   - max_worker_processes should not exceed CPU core count
#   - work_mem stacks per parallel operation per query: keep it conservative on
#     high-concurrency workloads (many connections * many parallel ops * work_mem = OOM)
#   - effective_cache_size is a planner hint only, it does not allocate memory
# --------------------------------------------------

# memory
shared_buffers = 4GB                    # 25% of RAM
effective_cache_size = 12GB             # 75% of RAM (planner hint only, not allocated)
work_mem = 32MB                         # per sort/hash op - stacks per parallel worker
maintenance_work_mem = 512MB            # for VACUUM, CREATE INDEX
wal_buffers = 64MB

# required when using a custom config file - docker default sets this but our
# config overrides it, so postgres would otherwise only listen on localhost
listen_addresses = '*'

# connections - keep low, use PgBouncer in front
max_connections = 100

# checkpoints
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# query planner
random_page_cost = 1.1                  # assume SSD (default 4.0 is for spinning disk)
effective_io_concurrency = 200          # SSD parallelism

# parallelism (match to CPU core count, not RAM)
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# logging (prod)
log_min_duration_statement = 1000       # log queries > 1s
log_checkpoints = on
log_lock_waits = on

# stats
track_activity_query_size = 2048
