[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:serve]
command=/usr/local/bin/php artisan octane:start --port=80 --admin-port=2019 --caddyfile=Caddyfile
autostart=true
autorestart=true
startretries=10
startsecs=5
priority=2
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
directory=/var/www/html

[program:queue-worker]
command=/usr/local/bin/php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000 --memory=256
numprocs=4
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker.log
priority=3
directory=/var/www/html